<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find local services · Najdi Usluga</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></head>
<body class="app-page search-app-page" id="search-app">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">N</span><span>Najdi Usluga</span></a><nav class="main-nav"><a class="active" href="/search">Browse services</a><a href="/#how-it-works">How it works</a><a href="/#for-providers">For providers</a></nav><nav class="nav-links" data-auth-nav></nav></header>
<main class="search-page"><section class="search-intro"><div><p class="eyebrow"><span></span> Local experts, selected for you</p><h1>Find your professional</h1><p>Search verified providers and book a time that works for you.</p></div><div class="search-trust"><span>✓ Verified profiles</span><span>★ Trusted reviews</span></div></section>
<form id="filters" class="filters"><label class="filter-keyword"><span>What do you need?</span><div class="input-with-icon"><i>⌕</i><input id="query" name="query" type="search" placeholder="Mechanic, dentist, cleaning..."></div></label><label><span>Category</span><select id="category" name="category"><option value="">All categories</option></select></label><label><span>Rating</span><select id="minimumRating" name="minimumRating"><option value="">Any rating</option><option value="4">4+ stars</option><option value="4.5">4.5+ stars</option></select></label><label><span>Radius</span><select id="radius" name="radius"><option value="1">1 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option></select></label><label><span>Sort by</span><select id="sort" name="sort"><option value="distance">Nearest</option><option value="rating">Highest rated</option><option value="reviews">Most reviewed</option><option value="name">Name A–Z</option></select></label><button type="submit" class="primary filter-submit">Search <span>→</span></button><div class="location-filter"><span class="location-label">⌖ Search around</span><input id="address-search" type="text" placeholder="Enter an address in North Macedonia"><button id="find-address" type="button" class="secondary">Find address</button><button id="use-location" type="button" class="text-button">◎ Use my location</button></div></form>
<section class="results-layout"><div class="results-column"><div class="results-heading"><div><p class="eyebrow">Recommended</p><h2>Professionals near you</h2></div><span id="result-count" class="count-pill">Loading…</span></div><div id="status" class="notice" hidden></div><div id="provider-list" class="provider-list"></div><div class="pager"><button id="previous-page" class="secondary">← Previous</button><span id="page-label"></span><button id="next-page" class="secondary">Next →</button></div></div><div class="map-column"><div class="map-label">Map view</div><div id="map" class="map" role="application" aria-label="Provider map"></div><div id="map-message" class="map-message" hidden></div></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script><script th:src="@{/js/search.js}" defer></script><script th:src="@{/js/nav.js}" defer></script></body></html>
