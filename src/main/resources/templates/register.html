<!doctype html><html lang="mk" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n-text="[[0,&quot;Create account · Najdi Usluga&quot;]]">Создај сметка · Најди Услуга</title><link rel="stylesheet" th:href="@{/css/app.css}"><script src="/js/i18n-messages.js" defer></script><script src="/js/i18n.js" defer></script></head><body class="auth-page"><main class="auth-shell"><a class="brand" href="/" data-i18n-text="[[0,&quot;Najdi Usluga&quot;]]">Најди Услуга</a><label class="language-control"><span class="language-label" data-i18n-text="[[0,&quot;Language&quot;]]">Јазик</span><select id="language-switcher" aria-label="Јазик" data-i18n-aria-label="Language"><option value="mk" lang="mk">Македонски</option><option value="en" lang="en">English</option></select></label><section class="auth-card"><p class="eyebrow" data-i18n-text="[[0,&quot;Join the community&quot;]]">Придружете се на заедницата</p><h1 data-i18n-text="[[0,&quot;Create account&quot;]]">Создај сметка</h1><form id="register-form"><div class="form-grid"><label data-i18n-text="[[0,&quot;First name&quot;]]">Име<input name="firstName" autocomplete="given-name" required maxlength="80"></label><label data-i18n-text="[[0,&quot;Last name&quot;]]">Презиме<input name="lastName" autocomplete="family-name" required maxlength="80"></label></div><label data-i18n-text="[[0,&quot;Email&quot;]]">Е-пошта<input name="email" type="email" autocomplete="email" required></label><label data-i18n-text="[[0,&quot;Phone&quot;]]">Телефон<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label><label data-i18n-text="[[0,&quot;Password&quot;]]">Лозинка<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><small data-i18n-text="[[0,&quot;Use at least 8 characters.&quot;]]">Користете најмалку 8 знаци.</small></label><button class="primary" type="submit" data-i18n-text="[[0,&quot;Create account&quot;]]">Создај сметка</button></form><div id="auth-status" class="notice" hidden></div><p data-i18n-text="[[0,&quot;Already registered?&quot;]]">Веќе имате сметка? <a class="text-link" href="/login" data-i18n-text="[[0,&quot;Log in&quot;]]">Најави се</a></p></section></main><script th:src="@{/js/auth.js}" defer></script></body></html>
