<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider profile · Najdi Usluga</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></head>
<body class="app-page" id="profile-app" th:attr="data-provider-id=${providerId}">
<header class="topbar"><a class="brand" href="/">Najdi Usluga</a><div class="header-actions"><a class="text-link" href="/search">Back to search</a><nav class="nav-links" data-auth-nav></nav></div></header>
<main class="detail-page">
  <div id="profile-status" class="notice">Loading provider…</div>
  <article id="profile" class="profile-card" hidden>
    <section class="profile-main"><p id="profile-category" class="eyebrow"></p><h1 id="profile-name"></h1><p id="profile-rating" class="provider-meta"></p><p id="profile-description" class="profile-description"></p><h2>Contact</h2><address id="profile-address"></address><p><a id="profile-phone"></a><br><a id="profile-email"></a><br><a id="profile-website" target="_blank" rel="noopener noreferrer"></a></p>
      <section class="booking-card"><h2>Book a reservation</h2><form id="booking-form"><label>Date<input id="booking-date" type="date" required></label><label>Available time<select id="booking-slot" required disabled><option value="">Choose a date first</option></select></label><label>Notes<textarea id="booking-notes" maxlength="1000" rows="3" placeholder="Optional details for the provider"></textarea></label><button class="primary" type="submit">Request reservation</button></form><div id="booking-status" class="notice" hidden></div></section>
    </section>
    <aside><div id="profile-map" class="map profile-map" aria-label="Provider location"></div><div id="profile-map-message" class="map-message" hidden></div><section class="hours-card"><h2>Opening hours</h2><div id="availability"></div></section></aside>
  </article>
  <section id="reviews-section" class="reviews-section" hidden><div class="results-heading"><h2>Customer reviews</h2><span id="reviews-count"></span></div><div id="reviews-list" class="reviews-list"></div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script><script th:src="@{/js/provider-profile.js}" defer></script>
<script th:src="@{/js/nav.js}" defer></script>
</body></html>
