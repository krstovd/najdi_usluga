<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Najdi Usluga</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><main class="auth-shell"><a class="brand" href="/">Najdi Usluga</a><section class="auth-card"><p class="eyebrow">Join the community</p><h1>Create account</h1><form id="register-form"><div class="form-grid"><label>First name<input name="firstName" autocomplete="given-name" required maxlength="80"></label><label>Last name<input name="lastName" autocomplete="family-name" required maxlength="80"></label></div><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><small>Use at least 8 characters.</small></label><button class="primary" type="submit">Create account</button></form><div id="auth-status" class="notice" hidden></div><p>Already registered? <a class="text-link" href="/login">Log in</a></p></section></main><script th:src="@{/js/auth.js}" defer></script></body></html>
