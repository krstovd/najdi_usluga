<!doctype html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n-text="[[0,&quot;Provider profile · Najdi Usluga&quot;]]">Профил на давател на услуги · Најди Услуга</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><script src="/js/i18n-messages.js" defer></script><script src="/js/i18n.js" defer></script></head>
<body class="app-page" id="profile-app" th:attr="data-provider-id=${providerId}">
<header class="topbar"><a class="brand" href="/" data-i18n-text="[[0,&quot;Najdi Usluga&quot;]]">Најди Услуга</a><div class="header-actions"><a class="text-link" href="/search" data-i18n-text="[[0,&quot;Back to search&quot;]]">Назад кон пребарување</a><nav class="nav-links" data-auth-nav></nav></div><label class="language-control"><span class="language-label" data-i18n-text="[[0,&quot;Language&quot;]]">Јазик</span><select id="language-switcher" aria-label="Јазик" data-i18n-aria-label="Language"><option value="mk" lang="mk">Македонски</option><option value="en" lang="en">English</option></select></label></header>
<main class="detail-page">
  <div id="profile-status" class="notice" data-i18n-text="[[0,&quot;Loading provider…&quot;]]">Се вчитува давателот на услуги…</div>
  <article id="profile" class="profile-card" hidden>
    <section class="profile-main"><p id="profile-category" class="eyebrow"></p><h1 id="profile-name"></h1><p id="profile-rating" class="provider-meta"></p><p id="profile-description" class="profile-description"></p><h2 data-i18n-text="[[0,&quot;Contact&quot;]]">Контакт</h2><address id="profile-address"></address><p><a id="profile-phone"></a><br><a id="profile-email"></a><br><a id="profile-website" target="_blank" rel="noopener noreferrer"></a></p>
      <section class="booking-card"><h2 data-i18n-text="[[0,&quot;Book a reservation&quot;]]">Резервирај термин</h2><form id="booking-form"><label data-i18n-text="[[0,&quot;Date&quot;]]">Датум<input id="booking-date" type="date" required></label><label data-i18n-text="[[0,&quot;Available time&quot;]]">Слободен термин<select id="booking-slot" required disabled><option value="" data-i18n-text="[[0,&quot;Choose a date first&quot;]]">Прво изберете датум</option></select></label><label data-i18n-text="[[0,&quot;Notes&quot;]]">Забелешки<textarea id="booking-notes" maxlength="1000" rows="3" placeholder="Дополнителни детали за давателот на услуги" data-i18n-placeholder="Optional details for the provider"></textarea></label><button class="primary" type="submit" data-i18n-text="[[0,&quot;Request reservation&quot;]]">Побарај резервација</button></form><div id="booking-status" class="notice" hidden></div></section>
    </section>
    <aside><div id="profile-map" class="map profile-map" aria-label="Локација на давателот на услуги" data-i18n-aria-label="Provider location"></div><div id="profile-map-message" class="map-message" hidden></div><section class="hours-card"><h2 data-i18n-text="[[0,&quot;Opening hours&quot;]]">Работно време</h2><div id="availability"></div></section></aside>
  </article>
  <section id="reviews-section" class="reviews-section" hidden><div class="results-heading"><h2 data-i18n-text="[[0,&quot;Customer reviews&quot;]]">Рецензии од корисници</h2><span id="reviews-count"></span></div><div id="reviews-list" class="reviews-list"></div></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script><script th:src="@{/js/provider-profile.js}" defer></script>
<script th:src="@{/js/nav.js}" defer></script>
</body></html>
