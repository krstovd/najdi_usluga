# Opt in with local,local-https; never activate this profile in production.
server.address=127.0.0.1
server.port=${LOCAL_HTTPS_PORT:8080}
server.ssl.enabled=true
server.ssl.key-store=${LOCAL_SSL_KEY_STORE:file:./certs/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${LOCAL_SSL_KEY_STORE_PASSWORD}
server.ssl.key-password=${LOCAL_SSL_KEY_PASSWORD:${LOCAL_SSL_KEY_STORE_PASSWORD}}
server.ssl.key-alias=localhost
server.servlet.session.cookie.secure=true
app.local-https.http-port=${LOCAL_HTTP_PORT:8081}
